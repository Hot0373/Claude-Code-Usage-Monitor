name: PC Monitor Build

on:
  push:
    branches: [pc-monitor]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2

      # 每次构建一个更高的版本号，已安装的程序会自动检查并更新到它。
      - name: Set version
        shell: pwsh
        run: |
          $version = "2.24.${{ github.run_number }}"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = "[^"]+"', "version = `"$version`"" | Set-Content Cargo.toml -NoNewline
          $lock = Get-Content Cargo.lock -Raw
          $lock = $lock -replace '(name = "claude-code-usage-monitor"\r?\nversion = )"[^"]+"', "`$1`"$version`""
          Set-Content Cargo.lock $lock -NoNewline
          Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1

      - name: Test local metrics and theme
        run: cargo test --locked pc_monitor

      - name: Build release binary
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: claude-code-usage-monitor
          path: target/release/claude-code-usage-monitor.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 本机 AI 监控 ${{ env.APP_VERSION }}
          prerelease: false
          make_latest: true
          files: target/release/claude-code-usage-monitor.exe
          body: |
            已经在用的程序会在一小时内自动更新到这个版本，不用手动下载。
            第一次安装：下载 claude-code-usage-monitor.exe，放进一个固定的文件夹（比如 %LOCALAPPDATA%\Programs\AI监控），双击运行。
